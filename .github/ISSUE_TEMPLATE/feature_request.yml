name: 💡 功能建议 / Feature request
description: 为 HumanTyper 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请先搜索一下是否已有相同的 issue。
        说清楚**你遇到的场景**比直接给出方案更有帮助。

  - type: dropdown
    id: area
    attributes:
      label: 相关功能
      multiple: true
      options:
        - 拟人节奏 / 速度
        - 模拟错字与修正
        - 思考停顿
        - 中文输入（拼音、选词、输入法切换）
        - 输入方式（标准 / 键盘扫描码 / 驱动级）
        - 自动暂停 / 自动继续
        - 打完核对
        - 快捷键
        - 界面 / 设置
        - 文件导入（UTF-8 / GBK 等）
        - 新功能（不属于以上任何一项）
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 遇到的问题
      description: 你在做什么时觉得不方便，或者缺少了什么？
      placeholder: 例如：通过 ToDesk 往远程电脑输入长文时，希望每段打完都停下来等我确认……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的功能
      description: 你希望 HumanTyper 怎么做？可以描述界面上的新选项、默认值、快捷键等
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
      description: 现在是怎么绕过这个问题的？用现有的设置组合能不能部分做到？

  - type: input
    id: target-app
    attributes:
      label: 目标程序（可选）
      description: 这个需求主要用在什么程序里？
      placeholder: 例如：Word / 微信 / Chrome 里的某网站 / 远程桌面

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 截图、示意图、参考的其他软件等

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true
        - label: 这个功能用于正当用途（演示、录屏、教学、无障碍辅助等），参见 README 免责声明
          required: true
        - label: 我愿意提交 Pull Request 来实现它

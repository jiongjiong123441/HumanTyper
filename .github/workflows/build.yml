name: Build & Release

# 自动构建：推送到 main、提交/更新 PR、或手动运行，都会编译并上传 exe（Actions 页面的 Artifacts）。
#   功能分支只在 PR 里构建一次，不再 push 和 pull_request 各跑一遍。
# 自动发布：推送到 main 且改动了代码时，发布一个新版本（vX.Y.N，N 自动递增）。
#   主/次版本号取自 HumanTyper.csproj 里的 <Version>，想发 1.1.x 就把它改成 1.1.0。
#   只改文档（*.md、LICENSE）只构建、不发布。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # PR 推了新提交就取消旧构建；main 上的发布不能中途取消
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history + tags to compute the version and changelog

      - name: Compute version
        id: ver
        shell: bash
        run: |
          base=$(grep -oP '<Version>\K[0-9]+\.[0-9]+' HumanTyper.csproj)
          # next patch = highest existing v<base>.N + 1
          last=$(git tag -l "v${base}.*" | sed "s/^v${base}\.//" | { grep -E '^[0-9]+$' || true; } | sort -n | tail -1)
          patch=$(( ${last:-0} + 1 ))
          echo "version=${base}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Version: ${base}.${patch}"

      - name: Build
        run: dotnet build HumanTyper.csproj -c Release -o out -p:Version=${{ steps.ver.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HumanTyper-${{ steps.ver.outputs.version }}
          path: out/HumanTyper.exe

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="v${VERSION}"
          prev=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$prev" ] && [ -z "$(git diff --name-only "$prev" HEAD | { grep -vE '\.md$|^LICENSE$|^docs/' || true; })" ]; then
            echo "Only docs changed since $prev — build only, no new release."
            exit 0
          fi
          {
            echo "## 更新内容"
            echo
            if [ -n "$prev" ]; then
              git log "${prev}..HEAD" --no-merges --pretty='- %s'
            else
              git log --no-merges --pretty='- %s'
            fi
            echo
            echo "## 下载"
            echo
            echo "下载下方的 **HumanTyper.exe**，双击运行即可（Windows 10/11，系统自带 .NET Framework 4.8，无需安装）。"
          } > notes.md
          gh release create "$tag" out/HumanTyper.exe \
            --title "HumanTyper ${tag}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest

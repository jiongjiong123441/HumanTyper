name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build HumanTyper.csproj -c Release -o out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HumanTyper
          path: out/HumanTyper.exe

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/HumanTyper.exe \
            --title "HumanTyper 最新构建" \
            --notes "main 分支自动构建（${GITHUB_SHA::7}）。下载 HumanTyper.exe 直接运行，需要 Windows 10/11（自带 .NET Framework 4.8）。" \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/HumanTyper.exe --title "HumanTyper $GITHUB_REF_NAME" --generate-notes
